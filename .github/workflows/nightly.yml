# The nightly lock advisor, posted to Discord. Reads Sleeper and ESPN live and the player
# model from snapshot/ (stats.nba.com blocks GitHub's IPs; refresh snapshot/ from the laptop).
#
# GitHub starts scheduled runs late, sometimes by 30+ minutes, and in UTC. So:
#   07:43 UTC = 3:43 am ET (2:43 am after DST ends): after the last West Coast game, the full
#               report -- odds and every open LOCK/ROLL call;
#   19:43 UTC = 3:43 pm ET (2:43 pm after DST ends): a reminder, posted only if a decision is
#               due before tonight's games.
name: nightly advisor

on:
  schedule:
    - cron: "43 7 * * *"
    - cron: "43 19 * * *"
  workflow_dispatch:
    inputs:
      only_if_due_today:
        description: "Post only decisions due today (the afternoon reminder)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Run the advisor and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          DUE_TODAY_INPUT: ${{ inputs.only_if_due_today }}
        run: |
          flag=""
          if [ "$SCHEDULE" = "43 19 * * *" ] || [ "$DUE_TODAY_INPUT" = "true" ]; then
            flag="--only-if-due-today"
          fi
          uv run --python 3.11 python -m engine.jobs.nightly --post \
            --data-dir snapshot --pool snapshot/pool.csv $flag
