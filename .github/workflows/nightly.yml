# The nightly lock advisor, posted to Discord. Reads Sleeper and ESPN live and the player
# model from snapshot/ (stats.nba.com blocks GitHub's IPs; refresh snapshot/ from the laptop).
#
# GitHub starts scheduled runs late, sometimes by 30+ minutes, and in UTC. So:
#   07:43 UTC = 3:43 am ET (2:43 am after DST ends): after the last West Coast game, the full
#               report -- odds and every open LOCK/ROLL call;
#   19:43 UTC = 3:43 pm ET (2:43 pm after DST ends): a reminder, posted only if a decision is
#               due before tonight's games.
# And on every push that can change a recommendation -- the model, the league rules, the
# snapshot it reads, or the advisor itself -- a full report headed with the commit's subject,
# so a call that flips is explained by the change that flipped it.
name: nightly advisor

on:
  schedule:
    - cron: "43 7 * * *"
    - cron: "43 19 * * *"
  push:
    branches: [main]
    paths:
      - engine/model/**
      - engine/ingest/**
      - engine/jobs/nightly.py
      - engine/jobs/lock_sheet.py
      - engine/jobs/build_board.py
      - config/league.json
      - config/player_overrides.csv
      - snapshot/**
  workflow_dispatch:
    inputs:
      only_if_due_today:
        description: "Post only decisions due today (the afternoon reminder)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Run the advisor and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          DUE_TODAY_INPUT: ${{ inputs.only_if_due_today }}
          EVENT: ${{ github.event_name }}
          # Passed as data, never interpolated into the script: a commit message can hold anything.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          flag=""
          if [ "$SCHEDULE" = "43 19 * * *" ] || [ "$DUE_TODAY_INPUT" = "true" ]; then
            flag="--only-if-due-today"
          fi
          reason=""
          if [ "$EVENT" = "push" ]; then
            reason="$COMMIT_MESSAGE"
          fi
          uv run --python 3.11 python -m engine.jobs.nightly --post \
            --data-dir snapshot --pool snapshot/pool.csv $flag --reason "$reason"
