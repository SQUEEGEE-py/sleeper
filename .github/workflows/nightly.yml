# The nightly lock advisor, posted to Discord. Reads Sleeper and ESPN live. Before each run the
# season being played is rebuilt from Sleeper's per-game stats and the board rebuilt on it
# (refresh_current_season + build_board, ~35 s); completed seasons come from snapshot/
# (stats.nba.com blocks GitHub's IPs, and they never change). If the refresh fails, the run
# falls back to snapshot/ as committed and the report says so.
#
# GitHub starts scheduled runs late (usually 5-20 minutes, once 7 hours), and only in UTC. So:
#   morning, 6:47 am Mountain (user's choice 2026-11-15: "7 AM MT", scheduled a little early so
#               it lands near 7): the full report -- odds and every open LOCK/ROLL call. Last
#               night's games are final and waivers (about 3 am ET) have run. Mountain time is
#               UTC-6 in summer time (MDT: the season to Oct 31, and from Mar 14) and UTC-7 in
#               winter (MST), and cron cannot follow that, so there are two schedules and the
#               "morning gate" step skips whichever does not match Denver's clock today;
#   19:43 UTC = 12:43 pm MST (1:43 pm MDT): a reminder, posted only if a decision is due
#               before tonight's games.
# The on-time trigger is a Cloudflare Worker (cloudflare/advisor-trigger, 2026-11-27): its Cron
# Triggers fire at 6:47 am MT and 19:43 UTC and start this workflow through workflow_dispatch,
# which, unlike `schedule:`, starts within seconds. The `schedule:` entries below are now a
# BACKUP, 30 minutes later: the "backup check" step skips one when the Worker's run of the same
# kind started in the last 3 hours and did not fail.
# Every --post run also posts lock-feedback messages to #daily-locks for any day whose games are
# all final, and reads the 🔒 reactions on earlier ones (idempotent; see lock_feedback.py).
# And on every push that can change a recommendation -- the model, the league rules, the
# snapshot it reads, or the advisor itself -- a full report headed with the commit's subject,
# so a call that flips is explained by the change that flipped it.
name: nightly advisor
run-name: ${{ inputs.trigger && format('nightly advisor ({0})', inputs.trigger) || 'nightly advisor' }}

on:
  schedule:
    # Backups for the Cloudflare trigger, 30 minutes after it (see the top of this file).
    - cron: "17 13 * * *"  # 7:17 am MDT
    - cron: "17 14 * * *"  # 7:17 am MST
    - cron: "13 20 * * *"
  push:
    branches: [main]
    paths:
      - engine/model/**
      - engine/ingest/**
      - engine/jobs/nightly.py
      - engine/jobs/lock_sheet.py
      - engine/jobs/build_board.py
      - config/league.json
      - config/player_overrides.csv
      - snapshot/**
      - state/**
  workflow_dispatch:
    inputs:
      only_if_due_today:
        description: "Post only decisions due today (the afternoon reminder)"
        type: boolean
        default: false
      trigger:
        description: "Who started this run (cloudflare-morning / cloudflare-reminder from the Worker)"
        type: string
        default: manual

permissions:
  contents: read
  actions: read  # the backup check lists this workflow's runs

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Morning gate (one of the two morning schedules matches Denver's clock)
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/Denver date +%Z)
          run=yes
          if [ "$SCHEDULE" = "17 13 * * *" ] && [ "$zone" != "MDT" ]; then run=no; fi
          if [ "$SCHEDULE" = "17 14 * * *" ] && [ "$zone" != "MST" ]; then run=no; fi
          echo "Denver is on $zone; schedule '${SCHEDULE:-none}'; run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Backup check (skip if the Cloudflare trigger already ran)
        id: backup
        if: steps.gate.outputs.run == 'yes' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          kind=morning
          if [ "$SCHEDULE" = "13 20 * * *" ]; then kind=reminder; fi
          since=$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)
          found=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly.yml/runs?event=workflow_dispatch&per_page=30" \
            --jq "[.workflow_runs[] | select(.display_title == \"nightly advisor (cloudflare-$kind)\" and .created_at > \"$since\" and (.status != \"completed\" or .conclusion == \"success\"))] | length")
          echo "Cloudflare $kind runs since $since that did not fail: $found"
          if [ "$found" -gt 0 ]; then
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare $kind trigger did not run (or failed); running the backup."
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'yes' && steps.backup.outputs.run != 'no'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'yes' && steps.backup.outputs.run != 'no'
        with:
          python-version: "3.11"
      - name: Install uv
        if: steps.gate.outputs.run == 'yes' && steps.backup.outputs.run != 'no'
        run: python -m pip install uv
      - name: Refresh this season's logs and the board from Sleeper
        if: steps.gate.outputs.run == 'yes' && steps.backup.outputs.run != 'no'
        id: refresh
        continue-on-error: true
        run: |
          mkdir -p data/nba
          cp snapshot/*.parquet data/nba/
          uv run --python 3.11 python -m engine.jobs.refresh_current_season
          uv run --python 3.11 python -m engine.jobs.build_board
      - name: Run the advisor and post to Discord
        if: steps.gate.outputs.run == 'yes' && steps.backup.outputs.run != 'no'
        env:
          REFRESH: ${{ steps.refresh.outcome }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Lock feedback (engine/jobs/lock_feedback.py): off unless both of the first two are set.
          DISCORD_LOCKS_WEBHOOK_URL: ${{ secrets.DISCORD_LOCKS_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_LOCKS_USER_ID: ${{ secrets.DISCORD_LOCKS_USER_ID }}
          SCHEDULE: ${{ github.event.schedule }}
          DUE_TODAY_INPUT: ${{ inputs.only_if_due_today }}
          EVENT: ${{ github.event_name }}
          # Passed as data, never interpolated into the script: a commit message can hold anything.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          flag=""
          if [ "$SCHEDULE" = "13 20 * * *" ] || [ "$DUE_TODAY_INPUT" = "true" ]; then
            flag="--only-if-due-today"
          fi
          reason=""
          if [ "$EVENT" = "push" ]; then
            reason="$COMMIT_MESSAGE"
          fi
          if [ "$REFRESH" = "success" ]; then
            uv run --python 3.11 python -m engine.jobs.nightly --post \
              --data-dir data/nba --pool data/board/pool.csv $flag --reason "$reason"
          else
            uv run --python 3.11 python -m engine.jobs.nightly --post \
              --data-dir snapshot --pool snapshot/pool.csv $flag --reason "$reason" \
              --note "data refresh from Sleeper failed this run (see the Actions log); using the committed snapshot"
          fi
