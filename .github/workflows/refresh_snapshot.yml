# Weekly: rebuild this season from Sleeper, rebuild the board, and commit the result to
# snapshot/ on main (user request, 2026-11-27). The nightly advisor already refreshes before
# every run but throws the result away; snapshot/ is what it falls back to when that refresh
# fails, and the base the refresh's own 3% / 0.5 fp check compares against, so it should not
# drift weeks behind.
#
# Monday 10:23 UTC (3:23 am MST): Sunday's late games are final, and it lands well before the
# 6:47 am MT report. The commit carries [skip ci], so it does not trigger nightly.yml's
# "re-run on snapshot/ change" report -- the morning run picks the new snapshot up anyway.
# If the refresh or the board fails, nothing is committed and the run fails visibly.
name: refresh snapshot

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Refresh this season's logs and the board from Sleeper
        run: |
          mkdir -p data/nba
          cp snapshot/*.parquet data/nba/
          uv run --python 3.11 python -m engine.jobs.refresh_current_season
          uv run --python 3.11 python -m engine.jobs.build_board
      - name: Publish to snapshot/
        run: uv run --python 3.11 python -m engine.jobs.publish_snapshot
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/
          # The manifest's timestamp always changes; only commit when a data file did.
          if git diff --cached --quiet -- snapshot/ ':!snapshot/manifest.json'; then
            echo "No data changed; nothing to commit."
            exit 0
          fi
          git commit -m "phase3: weekly snapshot refresh [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push failed (attempt $attempt); rebasing on main and retrying"
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1
